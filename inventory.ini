# [group] lets us group together hosts so we can target the head node and compute nodes separately
# This is useful because the head and compute nodes often need different packages, configs, etc.

[head]
head ansible_host=head

[compute]
c1 ansible_host=c1
c2 ansible_host=c2
c3 ansible_host=c3

[cluster:children]
head
compute

[all:vars]
ansible_user=root
ansible_ssh_common_args="-o StrictHostKeyChecking=no"