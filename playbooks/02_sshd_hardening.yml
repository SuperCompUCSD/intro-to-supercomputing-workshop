- name: SSH hardening
  hosts: all
  become: true
  gather_facts: false

  vars:
    sshd_config_path: /etc/ssh/sshd_config # this is the file that's used to configure the SSH server on a linux machine

  tasks:
    - name: Deploy hardened sshd_config
      <FILL IN>: # TODO: fill in the module we should call here to copy our sshd_config to sshd_config_path
        # TODO: add other necessary arguments
        # DO NOT REMOVE the three fields below, or you might lock yourself out
        owner: root
        group: root
        mode: "0600"

    # Don't worry about everything below here
    - name: Validate sshd config syntax
      ansible.builtin.command: "/usr/sbin/sshd -t -f {{ sshd_config_path }}"
      changed_when: false

    - name: Reload sshd if running
      ansible.builtin.shell: |
        set -euo pipefail
        pids="$(pidof sshd || true)"
        if [ -n "$pids" ]; then
          # pidof may return multiple PIDs; send HUP to all of them
          kill -HUP $pids
        else
          /usr/sbin/sshd
        fi
      args:
        executable: /bin/bash
      register: reload_result
      ignore_errors: true
