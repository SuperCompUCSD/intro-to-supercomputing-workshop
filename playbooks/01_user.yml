- name: Create non-root user and set up SSH key
  hosts: all
  become: true # "become" super user, required to create a new user
  vars_files:
    - vars.yml
  tasks:
    - name: Create user
      ansible.builtin.user:
        name: "{{ username }}"
        groups: wheel # being in the wheel group ensures this user has the ability to run priviledged commands
        append: true # append the group to the user's current list of groups, as opposed to replacing it
        create_home: true # create the user's home directory at /home/{{username}}

    - name: Create .ssh directory
      ansible.builtin.file:
        # this directory is where your ssh key will be installed, so we need to make sure it exists
        path: "/home/{{ username }}/.ssh"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0700"

    - name: Install authorized key
